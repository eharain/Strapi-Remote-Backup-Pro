name: Feature request
description: Suggest something the tool should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution you have in mind.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations: { required: false }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backup
        - Restore
        - A backup destination
        - Scheduling
        - Desktop app
        - CLI
        - Archive format
        - Other
    validations: { required: true }
